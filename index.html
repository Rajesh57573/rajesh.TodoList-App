<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,edit,light_mode,dark_mode" />
  </head>
  <body class="light">
    <nav>
      <button id="theme-btn"><span class="material-symbols-outlined">light_mode</span></button>
    </nav>
    <main>
      <div class="container">
        <h1>My TodoList App</h1>
        <p>Welcome to this todo list. Stay organized, manage your daily tasks, and track your progress—all in one place. ✨</p>
        <div class="input-box">
            <input type="text" id="todo-input" placeholder="Enter or Add Your Task">
            <button id="todo-btn">Add</button>
          </div>
        <ul id="todo-list"></ul>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
